<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="infomedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6FFFA" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.35" />
    </filter>
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#22D3EE" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#infomedBg)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border Accent -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#34D399" stroke-width="3" stroke-opacity="0.3" />

  <!-- The "Info" Dot (Crown / Info Pillar Header) -->
  <circle cx="256" cy="144" r="28" fill="#A7F3D0" />
  <circle cx="256" cy="144" r="14" fill="#047857" />

  <!-- Medical Cross / Info "i" Body -->
  <!-- Vertical pillar of Cross -->
  <rect x="220" y="196" width="72" height="196" rx="36" fill="url(#crossGrad)" />
  <!-- Horizontal beam of Cross -->
  <rect x="148" y="244" width="216" height="72" rx="36" fill="url(#crossGrad)" />

  <!-- Dynamic ECG / Pulse Wave across Cross (Signifying Live Data & Health Intelligence) -->
  <path d="M 124 280 L 192 280 L 220 236 L 244 324 L 272 250 L 296 280 L 388 280" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#pulseGlow)" />
</svg>
